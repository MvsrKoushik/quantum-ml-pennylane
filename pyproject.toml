[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "quantum-ml-pennylane"
version = "1.0.0"
description = "Small reproducible variational quantum classifier experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
[project.optional-dependencies]
quantum = ["pennylane>=0.36"]
dev = ["pytest>=8"]
[tool.pytest.ini_options]
pythonpath = ["src"]

